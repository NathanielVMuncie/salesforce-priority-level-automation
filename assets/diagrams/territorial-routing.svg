<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="390" viewBox="0 0 680 390" role="img">
<title>Regional Territory Assignment — Territorial Routing</title>
<desc>Assignment Rule routes leads by State to East Coast, Central, or West Coast regions. Priority Level High leads are subsequently escalated by the Flow.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Assignment Rule header -->
<rect x="160" y="30" width="360" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="53" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Regional Territory Assignment</text>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="71" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">Assignment Rule</text>

<!-- Fan stem -->
<line x1="340" y1="94" x2="340" y2="112" stroke="#5F5E5A" stroke-width="1.5" fill="none"/>
<!-- Fan bar -->
<line x1="135" y1="112" x2="545" y2="112" stroke="#5F5E5A" stroke-width="1.5" fill="none"/>
<!-- Fan drops -->
<line x1="135" y1="112" x2="135" y2="144" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<line x1="340" y1="112" x2="340" y2="144" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<line x1="545" y1="112" x2="545" y2="144" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

<!-- East Coast Region -->
<rect x="40" y="144" width="190" height="100" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="135" y="174" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">East Coast Region</text>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="135" y="192" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">Luis Navarro</text>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="135" y="210" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">Sales Representative</text>

<!-- Central Region -->
<rect x="250" y="144" width="180" height="100" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="174" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Central Region</text>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="192" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Priya Desai</text>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="210" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Sales Representative</text>

<!-- West Coast Region -->
<rect x="450" y="144" width="190" height="100" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="545" y="174" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">West Coast Region</text>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="545" y="192" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">Jordan Chen</text>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="545" y="210" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">Sales Representative</text>

<!-- Note -->
<rect x="80" y="270" width="520" height="72" rx="8" fill="#F8F8F7" stroke="#AAAAAA" stroke-width="0.5"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="294" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Priority Level High leads are escalated to the National Sales Director</text>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="312" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">via Lead Scoring and Priority Level Assignment — overrides regional OwnerId</text>

</svg>