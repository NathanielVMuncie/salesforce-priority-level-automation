<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img">
<title>Lead Scoring and Priority Level Assignment — Flow Segments</title>
<desc>Four segments: Weighted Scoring, Priority Assignment, Escalation, and Single DML write.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Entry trigger -->
<rect x="160" y="30" width="360" height="60" rx="8" fill="#F8F8F7" stroke="#AAAAAA" stroke-width="0.5"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="51" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Lead Record created</text>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="69" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">After-Save trigger fires</text>

<line x1="340" y1="90" x2="340" y2="114" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

<!-- Segment 1: Weighted Scoring -->
<rect x="160" y="116" width="360" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="141" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Weighted Scoring</text>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="159" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">3 tiers → varTotalScore (3–15)</text>

<line x1="340" y1="184" x2="340" y2="208" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

<!-- Segment 2: Priority Assignment -->
<rect x="160" y="210" width="360" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="234" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Priority Assignment</text>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="252" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">varTotalScore → High, Medium, or Low</text>

<line x1="340" y1="274" x2="340" y2="298" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

<!-- Segment 3: Escalation -->
<rect x="160" y="300" width="360" height="88" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="326" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">Escalate High Priority to Sophia</text>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="344" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">High → OwnerId set to Sophia Delgado</text>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="362" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">Med / Low → retains regional OwnerId</text>

<line x1="340" y1="388" x2="340" y2="412" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

<!-- Segment 4: Single DML Write -->
<rect x="160" y="414" width="360" height="72" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="441" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">Update Lead Priority and Score</text>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="459" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">OwnerId + Priority_Level__c — single write</text>

</svg>