<svg width="100%" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Lead Scoring and Priority Level Assignment — Flow sequence</title>
<desc>Three scoring tiers feed varTotalScore into the Priority Level decision, which branches to High, Medium, or Low before converging at escalation and single DML write.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .th  { font-size: 14px; font-weight: 600; }
    .ts  { font-size: 12px; font-weight: 400; }
    .arr { stroke: #999; stroke-width: 1.5; fill: none; stroke-linecap: round; }
  </style>
</defs>

<!-- START -->
<rect x="270" y="40" width="140" height="36" rx="18" fill="#f5f5f5" stroke="#c0c0c0" stroke-width="0.8"/>
<text class="ts" x="340" y="58" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">record created</text>
<line x1="340" y1="76" x2="340" y2="96" class="arr" marker-end="url(#arr)"/>

<!-- TIER 1 -->
<rect x="140" y="96" width="400" height="64" rx="8" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.8"/>
<text class="th" x="340" y="120" text-anchor="middle" dominant-baseline="central" fill="#085041">Tier 1 — Business Type score</text>
<text class="ts" x="340" y="143" text-anchor="middle" dominant-baseline="central" fill="#0f6e56">5 scored outcomes · 1–5 pts added to varTotalScore</text>
<line x1="540" y1="128" x2="563" y2="128" class="arr" stroke-dasharray="3 2" marker-end="url(#arr)"/>
<text class="ts" x="568" y="118" dominant-baseline="central" fill="#999">→ end</text>
<line x1="340" y1="160" x2="340" y2="184" class="arr" marker-end="url(#arr)"/>

<!-- TIER 2 -->
<rect x="140" y="184" width="400" height="64" rx="8" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.8"/>
<text class="th" x="340" y="208" text-anchor="middle" dominant-baseline="central" fill="#085041">Tier 2 — Role score</text>
<text class="ts" x="340" y="231" text-anchor="middle" dominant-baseline="central" fill="#0f6e56">5 scored outcomes · 1–5 pts added to varTotalScore</text>
<line x1="540" y1="216" x2="563" y2="216" class="arr" stroke-dasharray="3 2" marker-end="url(#arr)"/>
<text class="ts" x="568" y="206" dominant-baseline="central" fill="#999">→ end</text>
<line x1="340" y1="248" x2="340" y2="272" class="arr" marker-end="url(#arr)"/>

<!-- TIER 3 -->
<rect x="140" y="272" width="400" height="64" rx="8" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.8"/>
<text class="th" x="340" y="296" text-anchor="middle" dominant-baseline="central" fill="#085041">Tier 3 — Purchasing Timeline score</text>
<text class="ts" x="340" y="319" text-anchor="middle" dominant-baseline="central" fill="#0f6e56">5 scored outcomes · 1–5 pts added to varTotalScore</text>
<line x1="540" y1="304" x2="563" y2="304" class="arr" stroke-dasharray="3 2" marker-end="url(#arr)"/>
<text class="ts" x="568" y="294" dominant-baseline="central" fill="#999">→ end</text>
<line x1="340" y1="336" x2="340" y2="360" class="arr" marker-end="url(#arr)"/>

<!-- PRIORITY LEVEL -->
<rect x="140" y="360" width="400" height="64" rx="8" fill="#eeedfe" stroke="#7f77dd" stroke-width="0.8"/>
<text class="th" x="340" y="384" text-anchor="middle" dominant-baseline="central" fill="#3c3489">Determine Priority Level</text>
<text class="ts" x="340" y="407" text-anchor="middle" dominant-baseline="central" fill="#534ab7">Score range 3–15 · High evaluated first</text>

<!-- Fan from Priority Level -->
<line x1="340" y1="424" x2="340" y2="434" class="arr"/>
<line x1="155" y1="434" x2="525" y2="434" class="arr"/>
<line x1="155" y1="434" x2="155" y2="444" class="arr" marker-end="url(#arr)"/>
<line x1="340" y1="434" x2="340" y2="444" class="arr" marker-end="url(#arr)"/>
<line x1="525" y1="434" x2="525" y2="444" class="arr" marker-end="url(#arr)"/>

<!-- Priority outcome pills -->
<rect x="80" y="444" width="150" height="52" rx="8" fill="#faece7" stroke="#d85a30" stroke-width="0.8"/>
<text class="th" x="155" y="463" text-anchor="middle" dominant-baseline="central" fill="#712b13">High</text>
<text class="ts" x="155" y="482" text-anchor="middle" dominant-baseline="central" fill="#993c1d">≥ 12 pts</text>
<rect x="265" y="444" width="150" height="52" rx="8" fill="#faeeda" stroke="#d48c0a" stroke-width="0.8"/>
<text class="th" x="340" y="463" text-anchor="middle" dominant-baseline="central" fill="#7a5008">Medium</text>
<text class="ts" x="340" y="482" text-anchor="middle" dominant-baseline="central" fill="#a06c10">≥ 8 pts</text>
<rect x="450" y="444" width="150" height="52" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
<text class="th" x="525" y="463" text-anchor="middle" dominant-baseline="central" fill="#444441">Low</text>
<text class="ts" x="525" y="482" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">&lt; 8 pts</text>

<!-- Converge -->
<line x1="155" y1="496" x2="155" y2="510" class="arr"/>
<line x1="340" y1="496" x2="340" y2="510" class="arr"/>
<line x1="525" y1="496" x2="525" y2="510" class="arr"/>
<line x1="155" y1="510" x2="525" y2="510" class="arr"/>
<line x1="340" y1="510" x2="340" y2="530" class="arr" marker-end="url(#arr)"/>

<!-- ESCALATION + DML WRITE -->
<rect x="175" y="530" width="330" height="56" rx="8" fill="#f5f5f5" stroke="#c0c0c0" stroke-width="0.8"/>
<text class="th" x="340" y="552" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">Escalation &amp; Update Records</text>
<text class="ts" x="340" y="572" text-anchor="middle" dominant-baseline="central" fill="#555">OwnerId override · single DML write</text>
</svg>
