<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="197" y="257" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Receives payload</text>
<line x1="295" y1="248" x2="335" y2="248" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<rect x="335" y="214" width="265" height="68" rx="8" fill="#F8F8F7" stroke="#AAAAAA" stroke-width="0.5"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="467" y="239" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Salesforce Create Record</text>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="467" y="257" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Maps fields, creates Lead</text>

<line x1="340" y1="298" x2="340" y2="326" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
