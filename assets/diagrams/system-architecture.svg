<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="190" y="413" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">Assignment</text>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="190" y="429" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">Assignment Rule</text>

<line x1="310" y1="413" x2="340" y2="413" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

<!-- Flow -->
<rect x="340" y="368" width="275" height="90" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="477" y="397" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">Lead Scoring and</text>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="477" y="413" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">Priority Level Assignment</text>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="477" y="429" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">After-Save Flow</text>

