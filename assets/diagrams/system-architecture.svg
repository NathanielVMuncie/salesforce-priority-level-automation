<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img">
<title>Céleste Vineyards — System Architecture</title>
<desc>Three-layer pipeline: Wix gatekeeper, Make.com middleware, Salesforce Sales Cloud automation.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- WIX LAYER -->
<rect x="25" y="30" width="630" height="118" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="45" y="52" font-size="12" font-weight="400" fill="#085041" text-anchor="start" dominant-baseline="central">Wix</text>
<rect x="130" y="66" width="420" height="62" rx="8" fill="#F8F8F7" stroke="#AAAAAA" stroke-width="0.5"/>
