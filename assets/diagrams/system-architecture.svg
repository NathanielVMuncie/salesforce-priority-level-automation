<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="340" y="106" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Gatekeeper</text>

<line x1="340" y1="148" x2="340" y2="176" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" x="352" y="162" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">B2B payload only</text>

<!-- MAKE.COM LAYER -->
<rect x="25" y="178" width="630" height="120" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
